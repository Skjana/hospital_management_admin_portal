<p>dashboard works!</p>
<div class="dashboard-container"  [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Fixed Sidebar -->
  <div class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <i class="fas fa-heart-pulse"></i>
      <h2>ADMIN PORTAL</h2>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/layout" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fas fa-home"></i>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/layout/manage-departments" routerLinkActive="active">
        <i class="fas fa-hospital"></i>
        <span>Departments</span>
      </a>
      <a class="nav-item" routerLink="/layout/role-management" routerLinkActive="active">
        <i class="fa fa-user-plus"></i>
        <span>User Role</span>
      </a>
      <a class="nav-item" routerLink="/layout/doctors-management" routerLinkActive="active">
        <i class="fas fa-user-md"></i>
        <span>Doctors</span>
      </a>
      <a class="nav-item" routerLink="/layout/patient-management" routerLinkActive="active">
        <i class="fas fa-procedures"></i>
        <span>Patients</span>
      </a>
      <a class="nav-item" routerLink="/layout/staff-management" routerLinkActive="active">
        <i class="fas fa-users"></i>
        <span>Staff</span>
      </a>
      <!-- <a class="nav-item" routerLink="/customer/reports" routerLinkActive="active">
        <i class="fas fa-chart-line"></i>
        <span>Reports</span>
      </a> -->
      <a class="nav-item" routerLink="/layout/inquires" routerLinkActive="active">
         <i class="fas fa-question-circle"></i>
         <span>Inquiries</span>
      </a> 

      <a class="nav-item" routerLink="/layout/diagnostic" routerLinkActive="active">
        <i class="fas fa-chart-line"></i>
        <span>Diagnostic</span>
      </a>

      <a class="nav-item" routerLink="/layout/settings" routerLinkActive="active">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Fixed Top Bar -->
    <div class="top-bar">
    <button class="toggle-sidebar" (click)="toggleSidebar()">
        <i class="fas fa-bars"></i>
      </button>
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search...">
      </div>
      <div class="top-bar-actions">
        <div class="notification-icon">
          <i class="fas fa-bell"></i>
          <span class="notification-badge">
          </span>
          <!-- Notifications Dropdown -->
          <!-- <div class="notifications-dropdown" >
            <div class="notification-item">
              <div class="notification-content">
                <p></p>
                <small></small>
              </div>
            </div>
          </div> -->
        </div>
        <div class="user-menu" (click)="toggleUserMenu()">
          <img src="assets/images/profile.png" alt="User Avatar" class="user-avatar">
          <span></span>
          <!-- User Menu Dropdown -->
          <div class="user-dropdown" *ngIf="showUserMenu">
            <a class="dropdown-item" routerLink="/layout/profile">
              <i class="fas fa-user"></i>
              Profile
            </a>
            <a class="dropdown-item" routerLink="/layout/settings">
              <i class="fas fa-cog"></i>
              Settings
            </a>
            <a class="dropdown-item"  (click)="logout()">
              <i class="fas fa-sign-out-alt"></i>
              Logout
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-content">
      <router-outlet></router-outlet>

    </div>
  </div>

</div>
